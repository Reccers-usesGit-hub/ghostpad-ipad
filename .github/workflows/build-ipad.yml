# Publishes the GhostPad iPad app as a web app on GitHub Pages, so your friend can
# use it straight from Safari (Share -> Add to Home Screen). Runs on every change to ipad/www.
name: Publish iPad web app

on:
  push:
    branches: [main]
    paths: ['ipad/www/**', '.github/workflows/build-ipad.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Settings -> Pages -> Source: "GitHub Actions". GitHub's recommended two steps:
  # package the site, then deploy it.
  web-package:
    name: Web app - package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ipad/www

  web:
    name: Web app - publish on GitHub Pages
    needs: web-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
